<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1d2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>كاشير دار مسار</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="كاشير مسار">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"PlexAr";font-weight:400;src:url(fonts/ar-400.woff2) format("woff2")}
@font-face{font-family:"PlexAr";font-weight:500;src:url(fonts/ar-500.woff2) format("woff2")}
@font-face{font-family:"PlexAr";font-weight:600;src:url(fonts/ar-600.woff2) format("woff2")}
@font-face{font-family:"PlexAr";font-weight:700;src:url(fonts/ar-700.woff2) format("woff2")}
@font-face{font-family:"PlexAr";font-weight:400;src:url(fonts/la-400.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"PlexAr";font-weight:700;src:url(fonts/la-700.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"KufiD";font-weight:500;src:url(fonts/rk-500.woff2) format("woff2")}
@font-face{font-family:"KufiD";font-weight:700;src:url(fonts/rk-700.woff2) format("woff2")}
@font-face{font-family:"KufiD";font-weight:500;src:url(fonts/rkl-500.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"KufiD";font-weight:700;src:url(fonts/rkl-700.woff2) format("woff2");unicode-range:U+0000-00FF}
:root{
  /* ألوان هوية دار مسار */
  --maroon:#68053a;--maroon-2:#8a144e;--maroon-deep:#3a0320;--gold:#efb04a;--gold-deep:#b97c1c;--gold-soft:#fbefd9;
  --ink:#241a1f;--ink2:#4a3d44;--muted:#857680;--line:#ece4e8;--paper:#f6f2f4;--card:#fff;
  --ok:#1e7a52;--okbg:#e4f3eb;--warn:#9a6300;--warnbg:#fdf0d6;--bad:#b3261e;--badbg:#fbe7e5;
  --display:"KufiD","Reem Kufi","PlexAr","IBM Plex Sans Arabic",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"PlexAr","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 4px rgba(104,5,58,.09)}
.num,.mono{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--paper);border:1px solid var(--line)}

/* ===== الإطار: شريط جانبي بلون الدار ===== */
.app{display:grid;grid-template-columns:96px 1fr;height:100vh;height:100dvh}
.rail{background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-deep) 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;position:relative;z-index:20}
.rail::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:1px;background:linear-gradient(180deg,transparent,rgba(239,176,74,.45),transparent)}
.brand{display:block}
.logo{width:56px;height:64px;display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo.img{background:#fff;border-radius:12px;padding:4px;width:58px;height:58px}
nav.tabs{display:flex;flex-direction:column;gap:6px;margin-top:26px;width:100%;padding:0 10px}
nav.tabs button{color:rgba(255,255,255,.62);padding:10px 4px 8px;border-radius:14px;font-size:11.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;transition:color .2s,background .2s}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs button.on{color:#fff;background:rgba(255,255,255,.11)}
nav.tabs button.on::before{content:"";position:absolute;inset-inline-start:-10px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
nav.tabs button svg{width:23px;height:23px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px;text-align:center}
.sync{font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,.75);line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa0ad;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.dot.ok{background:#45d39a}.dot.wait{background:var(--gold)}.dot.off{background:#ff7a6e}
.who{font-size:10.5px;color:rgba(255,255,255,.6);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{overflow:hidden;min-height:0;height:100%;position:relative}
.view{height:100%;overflow:auto;padding:26px 30px 40px;animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}

/* ===== شاشة الكاشير ===== */
.pos{display:grid;grid-template-columns:1fr 410px;height:100%;min-height:0}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0;padding:22px 26px 0}
.scanbar{display:flex;gap:10px;align-items:center}
.scanbox{position:relative;flex:1}
.scanbox svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--maroon)}
#scan{padding:15px 16px;padding-inline-start:52px;font-size:16.5px;border-radius:16px;border:1.5px solid var(--line);background:#fff;box-shadow:0 1px 0 rgba(36,26,31,.03)}
.scanhint{font-size:12px;color:var(--muted);margin:7px 6px 0;display:flex;align-items:center;gap:7px}
.scanhint .led{width:7px;height:7px;border-radius:50%;background:#45d39a;animation:led 2.4s ease-in-out infinite}
@keyframes led{50%{box-shadow:0 0 0 5px rgba(69,211,154,.18)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border-radius:99px;background:transparent;border:1.5px solid var(--line);white-space:nowrap;font-size:13.5px;font-weight:500;color:var(--ink2);transition:all .2s}
.chip:hover{border-color:#d9ccd3}
.chip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.chip .c{opacity:.55;margin-inline-start:5px;font-size:12px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));grid-auto-rows:max-content;gap:22px 18px;align-content:start;padding:4px 4px 30px}
.book{text-align:start;display:flex;flex-direction:column;position:relative;border-radius:10px}
.cv{position:relative;aspect-ratio:2/3;border-radius:6px 10px 10px 6px;overflow:hidden;background:#e9e1e5;box-shadow:0 1px 1px rgba(36,26,31,.08),0 8px 18px -6px rgba(36,26,31,.28);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.cv::before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12) 40%,transparent);z-index:2;pointer-events:none}
.cv img.ci{width:100%;height:100%;object-fit:cover;display:block}
.book:hover .cv{transform:translateY(-4px);box-shadow:0 1px 1px rgba(36,26,31,.08),0 16px 26px -8px rgba(36,26,31,.35)}
.book:active .cv{transform:scale(.97)}
.gen{position:absolute;inset:0;background:var(--c,var(--maroon));color:#fff;padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.gen::after{content:"";position:absolute;inset:8px;border:1px solid rgba(239,176,74,.45);border-radius:4px;pointer-events:none}
.gen img{position:absolute;width:62%;top:10%;inset-inline-start:19%;opacity:.13}
.gen b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.35;position:relative}
.gen small{font-size:11px;opacity:.75;position:relative;color:var(--gold)}
.bt{font-weight:600;font-size:14px;line-height:1.4;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.price{font-weight:700;color:var(--maroon)}
.stk{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:500}
.stk.low{background:var(--warnbg);color:var(--warn)}.stk.out{background:var(--badbg);color:var(--bad)}
.incart{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:var(--maroon-deep);font-weight:700;font-size:13px;min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:3}
.incart.bump{animation:pop .3s var(--ease)}
.newtag{position:absolute;top:10px;inset-inline-start:0;font-size:10.5px;font-weight:600;background:var(--gold);color:var(--maroon-deep);padding:2px 9px 2px 8px;border-radius:0 99px 99px 0;z-index:3}
[dir=rtl] .newtag{border-radius:99px 0 0 99px}
.soldout .cv{filter:grayscale(.8);opacity:.6}
.grid.intro .book{animation:shelf .5s var(--ease) both;animation-delay:calc(var(--i,0) * 28ms + 120ms)}
@keyframes shelf{from{opacity:0;transform:translateY(14px)}}

/* ===== الفاتورة ===== */
.cart{background:#fff;display:flex;flex-direction:column;min-height:0;position:relative;box-shadow:0 0 0 1px var(--line),-12px 0 40px -24px rgba(36,26,31,.25)}
.cart-h{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 22px 14px}
.cart-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--maroon);line-height:1.2}
.cart-h .inv{font-size:12px;color:var(--muted);margin-top:2px}
.perf{height:10px;margin:0 16px;background:radial-gradient(circle at 5px 5px,var(--paper) 3.2px,transparent 3.6px) 0 0/14px 10px repeat-x;opacity:.9}
.lines{flex:1;overflow:auto;padding:4px 14px}
.empty{color:var(--muted);text-align:center;padding:44px 20px;font-size:14px}
.empty svg{width:52px;height:52px;opacity:.28;display:block;margin:0 auto 12px;color:var(--maroon)}
.line{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;padding:11px 8px;border-bottom:1px dashed var(--line);align-items:center;animation:lineIn .35s var(--ease)}
@keyframes lineIn{from{opacity:0;transform:translateX(-14px)}}
.line:last-child{border-bottom:0}
.line .th{grid-row:span 3;width:40px;height:58px;border-radius:3px 5px 5px 3px;overflow:hidden;box-shadow:0 3px 8px -2px rgba(36,26,31,.3);background:var(--maroon)}
.line .th img{width:100%;height:100%;object-fit:cover;display:block}
.line .t{font-weight:600;font-size:14px;line-height:1.35}
.line .p{font-size:12.5px;color:var(--muted)}
.line .p button{color:var(--maroon);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:0 4px;opacity:.75}
.line .ctl{grid-column:2/4;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.qty{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:10px;padding:3px}
.qty button{width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:600;display:grid;place-items:center;color:var(--maroon)}
.qty button:hover{background:#fff}
.qty span{min-width:26px;text-align:center;font-weight:700}
.lt{font-weight:700;text-align:end;font-size:14.5px}
.rm{color:var(--muted);font-size:12.5px;padding:4px 6px;border-radius:7px}.rm:hover{color:var(--bad);background:var(--badbg)}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
.cart-f{padding:14px 20px 18px;display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:13.5px;white-space:nowrap;transition:all .15s}
.seg button:hover{border-color:#d9ccd3}
.seg button.on{border-color:var(--maroon);background:var(--maroon);color:#fff}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
.drow{display:flex;gap:6px}
.drow .seg{flex:1}
.drow input{width:92px;flex:none;padding:8px 10px}
.tot{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink2)}
.tot div{display:flex;justify-content:space-between}
.tot .disc{color:var(--gold-deep)}
.cashrow{display:flex;gap:6px;align-items:center}
.cashrow input{flex:1;font-size:16px;font-weight:600}
.cashrow button{padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.change{font-size:14px;padding:9px 13px;border-radius:12px;background:var(--okbg);color:var(--ok);display:flex;justify-content:space-between;font-weight:600;animation:pop .25s var(--ease)}
.change.neg{background:var(--badbg);color:var(--bad)}
.paybtn{background:linear-gradient(135deg,var(--maroon-2),var(--maroon) 55%,var(--maroon-deep));color:#fff;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 24px -10px rgba(104,5,58,.7);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.paybtn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(104,5,58,.75)}
.paybtn:active{transform:scale(.99)}
.paybtn .pl{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px}
.paybtn .pv{font-family:var(--display);font-weight:700;font-size:26px;color:var(--gold);line-height:1}
.paybtn .pv small{font-size:13px;color:rgba(255,255,255,.7);font-family:"PlexAr",sans-serif;margin-inline-start:4px}
.paybtn kbd{background:rgba(255,255,255,.14);border:0;color:#fff}
.paybtn:disabled{background:#d8cfd4;box-shadow:none;cursor:not-allowed}.paybtn:disabled .pv{color:#fff}
.paybtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg)}
.paybtn:not(:disabled):hover::after{animation:sheen .9s var(--ease)}
@keyframes sheen{to{left:130%}}
.cust{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cust input{padding:8px 10px;font-size:14px}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";color:var(--maroon);font-weight:700;font-size:16px;width:14px}
details.more[open] summary::before{content:"−"}
details.more .in{padding-top:8px}
.mbar{display:none}
.flyer{position:fixed;z-index:90;pointer-events:none;border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.flyer img,.flyer div{width:100%;height:100%;object-fit:cover}

/* ===== عناصر عامة ===== */
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 0 0 1px var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:170px}
.btn{padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:#fff;border:1.5px solid var(--line);transition:all .15s;text-decoration:none;color:inherit}
.btn:hover{border-color:#d4c5cd}
.btn.pri{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn.pri:hover{background:var(--maroon-2)}
.btn.acc{background:var(--gold);color:var(--maroon-deep);border-color:var(--gold)}
.btn.danger{color:var(--bad);border-color:#f0cfcb}
.btn.sm{padding:6px 11px;font-size:13px}
.btn svg{width:17px;height:17px}
h1.vt{font-family:var(--display);font-weight:700;font-size:28px;color:var(--maroon);margin:0 0 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;line-height:1.3}
h1.vt .sub{font-family:"PlexAr",sans-serif;font-size:13.5px;color:var(--muted);font-weight:400}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:11px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
table.t td{padding:10px 12px;border-bottom:1px solid #f3eef1;vertical-align:middle}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover td{background:#fbf8fa}
table.t tr.void td{opacity:.5;text-decoration:line-through}
table.t td.n,table.t th.n{text-align:end}
table.t input.qin{width:84px;padding:6px 8px;text-align:center}
.tcov{width:32px;height:46px;border-radius:2px 4px 4px 2px;overflow:hidden;background:var(--maroon);box-shadow:0 2px 6px -2px rgba(0,0,0,.35);flex:none}
.tcov img{width:100%;height:100%;object-fit:cover;display:block}
.tbook{display:flex;align-items:center;gap:12px}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--paper);color:var(--ink2);white-space:nowrap}
.pill.red{background:var(--badbg);color:var(--bad)}.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}
.tablewrap{overflow:auto;max-height:calc(100vh - 230px)}
.hero{display:grid;grid-template-columns:minmax(260px,1.2fr) repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 0 0 1px var(--line)}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;margin-top:4px;line-height:1.2}
.kpi .v small{font-family:"PlexAr",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.kpi.main{background:linear-gradient(135deg,var(--maroon-2),var(--maroon) 50%,var(--maroon-deep));color:#fff;position:relative;overflow:hidden;box-shadow:none}
.kpi.main .k{color:rgba(255,255,255,.7)}
.kpi.main .v{font-size:40px;color:var(--gold)}.kpi.main .v small{color:rgba(255,255,255,.75)}
.kpi.main img{position:absolute;height:150%;inset-inline-end:-18px;top:-25%;opacity:.12}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card h3{margin:0 0 14px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:9px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--maroon));border-radius:99px}
.vbars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:10px}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vbars .vb i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,var(--maroon-2),var(--maroon));border-radius:6px 6px 2px 2px;min-height:2px}
.vbars .vb i.z{background:var(--line)}
.vbars .vb span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.vbars .vb b{font-size:10.5px;font-weight:600;color:var(--maroon)}
.absum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.absum>div{flex:1;min-width:92px;background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.absum b{font-size:20px;color:var(--maroon)}.absum span{font-size:12px;color:var(--muted)}
.ablist{display:flex;flex-direction:column;max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.abr{display:grid;grid-template-columns:44px 1fr 62px 78px;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}

function isbn10to13(s){ const b = "978" + s.slice(0,9); let sum=0; for (let i=0;i<12;i++) sum += (+b[i])*(i%2?3:1); return b + ((10 - sum%10)%10); }
function normCode(raw){

}

  if (!/^https?:$/.test(location.protocol) || location.hostname.endsWith("claude.ai") || location.hostname.endsWith("claudeusercontent.com")) return false;
  let d;
  try { d = await api("/api/state"); } catch (e) { if (e.code === "forbidden") { SRV = true; S.cloud = "readonly"; renderSync(); toast("امسح رمز QR من شاشة الإعدادات في الكمبيوتر لربط هذا الجهاز", "bad", 6000); return true; } return false; }
  SRV = true; S.cloud = "ok"; srvSeq = d.seq;
  applyDocs(Object.entries(d.docs || {}), true);
  try { SRVINFO = await api("/api/info"); } catch {}
  if (!Object.keys(d.docs || {}).some(k => k.startsWith("books/"))) {
    // جهاز جديد: ننتظر السحابة أولاً عشان نسترجع بيانات الدار بدل ما نبدأ من الصفر
    for (let i = 0; i < 24; i++) {
      try { SRVINFO = await api("/api/info"); } catch {}
      const c = SRVINFO && SRVINFO.cloud;
      if (!c || !c.enabled || c.lastOk || c.lastErr) break;
      await new Promise(r => setTimeout(r, 500));
    }
    try { const d2 = await api("/api/state"); srvSeq = d2.seq; applyDocs(Object.entries(d2.docs || {}), true); } catch {}
    if (!S.books.size) { const now = Date.now(); DEFAULT_CATALOG.forEach(b => putBook(cleanBook(b.isbn, {...b, updatedAt:now}))); }
    else toast("تم استرجاع بيانات الدار من السحابة ✓", "ok", 4000);
  }
  render(); flush();
  setInterval(pollServer, 2000);
  setInterval(async () => { try { SRVINFO = await api("/api/info"); renderSync(); } catch {} }, 10000);
  setTimeout(makeCoverThumbs, 4000);
  if (ls.get("coverTry", "") !== dayKey(Date.now())) { ls.set("coverTry", dayKey(Date.now())); setTimeout(() => fetchCovers(false), 1500); }
  return true;
}
let polling = false;
async function pollServer(){
  if (polling) return; polling = true;
  try {
    const d = await api("/api/changes?since=" + srvSeq);
    if (d.reset) { const st = await api("/api/state"); srvSeq = st.seq; applyDocs(Object.entries(st.docs || {}), true); refresh(); }
    else if (d.changes.length) { srvSeq = d.seq; applyDocs(d.changes.map(c => [c.path, c.data]), false); refresh(true); }
    else srvSeq = d.seq;
    if (S.cloud !== "ok" && S.cloud !== "readonly") { S.cloud = "ok"; renderSync(); }
    if (S.pending.length) flush();
  } catch (e) { if (S.cloud === "ok") { S.cloud = "slow"; renderSync(); } }
  finally { polling = false; }
}
/* --- وضع تطبيق الجوال عبر الإنترنت (Supabase) --- */
let supaCursor = ls.get("scur", ""), supaPolling = false;
async function supaPull(full){
  if (supaPolling) return; supaPolling = true;
  try {
    let since = full ? "1970-01-01T00:00:00Z" : (supaCursor || "1970-01-01T00:00:00Z"), first = full, got = 0;
    for (let guard = 0; guard < 60; guard++) {
      const rows = await supa("dm_pull", {k: ls.get("skey", ""), since, lim: 500});
      if (!rows.length) { if (first) applyDocs([], true); break; }
      applyDocs(rows.map(r => [r.path, r.deleted ? null : r.data]), first); first = false; got += rows.length;
      since = rows[rows.length - 1].updated_at;
      if (rows.length < 500) break;
    }
    supaCursor = since; ls.set("scur", supaCursor);
    if (full && !S.books.size) { const now = Date.now(); DEFAULT_CATALOG.forEach(b => putBook(cleanBook(b.isbn, {...b, updatedAt:now}))); render(); }
    if (S.cloud !== "readonly") S.cloud = "ok";
    if (got) refresh(true); else renderSync();
    if (S.pending.length) flush();
  } catch (e) {
    if (e.code === "forbidden") { S.cloud = "readonly"; pairScreen(true); } else if (S.cloud === "ok") S.cloud = "slow";
    renderSync();
  } finally { supaPolling = false; }
}

async function initCloud(){
  if (await initServer()) return;
  const isClaude = /claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname) || (window.claude && typeof window.claude.use === "function");
  if (!isClaude && /^https?:$/.test(location.protocol) && CLOUD.url) { await initSupa(); return; }
  const c = window.claude;
  if (!c || typeof c.use !== "function") { goLocal(); return; }
  let db = null;
  try { db = await c.use("db"); } catch {}
  try { DL = await c.use("downloads"); } catch {}
  if (!db) { goLocal(); return; }
  DB = db; S.cloud = "ok"; renderSync();
  const timer = setTimeout(() => { if (!S.loaded.books) { S.cloud = "slow"; renderSync(); } }, 10000);
  DB.collection("books").onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { if (d.exists) m.set(d.id, cleanBook(d.id, d.data())); });
    overlay("books", m);
    if (!snap.metadata.fromCache) { S.loaded.books = true; clearTimeout(timer); if (S.cloud === "slow") S.cloud = "ok"; }
    if (snap.metadata.fromCache && m.size === 0 && S.books.size) return;
    S.books = m; saveBooks(); refresh();
  }, e => { clearTimeout(timer); toast("تعذر الاتصال بقاعدة الكتب", "bad"); S.cloud = "local"; renderSync(); });
  DB.collection("sales").onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { if (d.exists) m.set(d.id, cleanSale(d.id, d.data())); });
    overlay("sales", m);
    // الاحتفاظ بأي فاتورة محلية لم تصل للسحابة بعد
    for (const [id, s] of S.sales) if (!m.has(id) && S.pending.some(p => p.path === "sales/" + id)) m.set(id, s);
    if (snap.metadata.fromCache && m.size === 0 && S.sales.size) return;
    if (!snap.metadata.fromCache) S.loaded.sales = true;
    S.sales = m; saveSales(); refresh(true);
  }, e => {});
  for (const c of COLS) DB.collection(c).onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { if (d.exists) m.set(d.id, CLEAN[c](d.id, d.data())); });
    overlay(c, m); if (snap.metadata.fromCache && m.size === 0 && S[c].size) return;
    S[c] = m; saveCol(c); _wh = null; _sold = null; refresh(true);
  }, e => {});
  DB.doc("config/settings").onSnapshot(d => {
    if (d.exists) { applySettings(d.data()); }
  }, e => {});
  flush();
}

function totals(){

  const count = S.cart.reduce((a,i) => a + i.qty, 0);
  const paid = S.method === "cash" && S.paid !== "" ? numIn(S.paid) : total;
  return {sub, d, total, count, paid, change: r3(paid - total)};

function tick(to){
  const el = $("#pvn"); if (!el) { lastTotal = to; return; }
  const from = lastTotal; lastTotal = to; cancelAnimationFrame(tickRaf);
  if (reduced() || from === to) { el.textContent = money(to); return; }
  const t0 = performance.now(), D = 380;
  const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); const n = $("#pvn"); if (!n) return; n.textContent = money(from + (to - from) * e); if (k < 1) tickRaf = requestAnimationFrame(step); };

}

function fly(b){
  if (reduced()) return;
  const src = document.querySelector(`.book[data-add="${CSS.escape(b.id)}"] .cv`);
  const dst = isDesktop() ? $("#cart .lines") : $("#mbar");
  if (!src || !dst) return;
  const a = src.getBoundingClientRect(), z = dst.getBoundingClientRect();
  if (!a.width || !z.width) return;
  const f = document.createElement("div"); f.className = "flyer";
  f.innerHTML = coverSrc(b) ? `<img src="${esc(coverSrc(b))}" alt="">` : `<div style="background:${catColor(b.category)}"></div>`;
  Object.assign(f.style, {left:a.left+"px", top:a.top+"px", width:a.width+"px", height:a.height+"px"});
  document.body.appendChild(f);
  const tx = (z.left + z.width/2) - (a.left + a.width/2), ty = (z.top + 40) - (a.top + a.height/2);
  f.animate([{transform:"translate(0,0) scale(1) rotate(0)", opacity:1},{transform:`translate(${tx*.5}px,${ty*.5 - 60}px) scale(.55) rotate(-6deg)`, opacity:1, offset:.55},{transform:`translate(${tx}px,${ty}px) scale(.18) rotate(-10deg)`, opacity:.2}], {duration:620, easing:"cubic-bezier(.5,0,.3,1)"}).onfinish = () => f.remove();
}

function bookSalesRows(){
  const f = rangeFilter(S.rrange, S.rdate), m = new Map();
  for (const s of S.sales.values()) { if (s.void || !f(s)) continue; const ratio = s.subtotal ? s.total / s.subtotal : 1;
    for (const i of s.items) { const r = m.get(i.id) || {qty:0, rev:0, wq:0}; r.qty += i.qty; r.rev += i.qty * i.price * ratio; m.set(i.id, r); } }
  for (const v of S.invoices.values()) { if (v.void || !f({ts: new Date(v.date + "T12:00").getTime()})) continue;

  const rows = sortedBooks().map(b => ({b, ...(m.get(b.id) || {qty:0, rev:0, wq:0})}));
  for (const [id, r] of m) if (!S.books.has(id)) rows.push({b:{id, title:"(كتاب محذوف)", isbn:id}, ...r});
  return rows;
}

    const W = 120, H = 176, c = document.createElement("canvas"); c.width = W; c.height = H;
    const k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k, x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    return c.toDataURL("image/jpeg", .82);
  } catch { return ""; }
}

function arWords(n){
  const ones = ["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens = ["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hund = ["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const u = x => { const h = Math.floor(x / 100), r = x % 100, p = []; if (h) p.push(hund[h]); if (r) { if (r < 20) p.push(ones[r]); else { const o = r % 10, t = Math.floor(r / 10); p.push(o ? ones[o] + " و" + tens[t] : tens[t]); } } return p.join(" و"); };
  if (!n) return "صفر";
  const th = Math.floor(n / 1000), r = n % 1000, p = [];
  if (th) p.push(th === 1 ? "ألف" : th === 2 ? "ألفان" : th <= 10 ? u(th) + " آلاف" : u(th) + " ألف");
  if (r) p.push(u(r));
  return p.join(" و");
}

/* --- قارئ الباركود (يعمل كلوحة مفاتيح: أرقام سريعة ثم Enter) --- */
let sbuf = "", slast = 0, sfirst = 0;
function keyChar(e){
  if (e.code && /^Digit\d$/.test(e.code)) return e.code.slice(5);
  if (e.code && /^Numpad\d$/.test(e.code)) return e.code.slice(6);
  if (e.key && e.key.length === 1) return toEn(e.key);
  return "";
}
document.addEventListener("keydown", e => {
  // اختصارات
  if (e.key === "Escape" && $("#modalRoot").innerHTML) { closeModal(); return; }
  if (e.key === "F2") { e.preventDefault(); if (S.view !== "pos") setView("pos"); $("#scan")?.focus(); $("#scan")?.select(); return; }
  if (e.key === "F8" && S.view === "pos") { e.preventDefault(); if (S.method !== "cash") { S.method = "cash"; renderCart(); } document.body.classList.add("cart-open"); $("#paid")?.focus(); return; }
  if ((e.key === "F9" || (e.key === "Enter" && (e.ctrlKey || e.metaKey))) && S.view === "pos" && !$("#modalRoot").innerHTML) { e.preventDefault(); completeSale(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const now = performance.now(), t = document.activeElement;
  if (e.key === "Enter") {
    const fast = sbuf.length >= 6 && now - slast < 90 && (slast - sfirst) < sbuf.length * 60;
    const code = sbuf; sbuf = "";
    // إيصال مفتوح: Enter = فاتورة جديدة
    if (!fast && $("#modalRoot .rc") && !(t && t.id !== "scan" && /INPUT|TEXTAREA/.test(t.tagName))) { e.preventDefault(); closeModal(); return; }
    if (fast && $("#modalRoot .rc")) { e.preventDefault(); closeModal(); if (t && t.id === "scan") { t.value = ""; S.q = ""; } handleScan(code); return; }
    if (t && t.id === "scan") { e.preventDefault(); const v = t.value.trim(); S.q = ""; t.value = "";
      const nc = normCode(v);
      if (/^[0-9X]{6,}$/.test(nc) && /^[\d٠-٩۰-۹\-\s xX]+$/.test(v)) handleScan(nc);
      else if (v) { const m = sortedBooks().filter(b => (S.cat === "all" || b.category === S.cat) && matchQ(b, v)); if (m.length === 1) addToCart(m[0]); else { S.q = v; t.value = v; renderGrid(); toast(m.length ? "اختر الكتاب من القائمة" : "لا توجد نتائج", m.length ? "" : "bad"); } }
      else renderGrid();
      return; }
    if (!fast) return;
    if (t && t.dataset && t.dataset.scanfield) { e.preventDefault(); t.value = normCode(code); return; }
    e.preventDefault();
    if (t && /INPUT|TEXTAREA/.test(t.tagName)) { // إزالة الأرقام اللي دخلت بالغلط في حقل آخر
      const v = t.value; if (v.length >= code.length) t.value = v.slice(0, v.length - code.length); t.dispatchEvent(new Event("input", {bubbles:true}));
    }
    if ($("#modalRoot [data-scanlist]")) { listScan(code); return; }
    if ($("#modalRoot").innerHTML && !$("#modalRoot .rc")) return; // نافذة مفتوحة: تجاهل
    if ($("#modalRoot .rc")) closeModal();
    handleScan(code); return;
  }
  const ch = keyChar(e);
  if (ch) { if (now - slast > 90) { sbuf = ""; sfirst = now; } sbuf += ch; slast = now; }
}, true);

/* ============ تشغيل ============ */
try { $("#splashImg").src = BRAND.full; } catch {}
renderLogo(); renderTabs(); render(); renderSync();
setTimeout(() => { const sp = $("#splash"); if (sp) { sp.classList.add("out"); setTimeout(() => sp.remove(), 600); } }, reduced() ? 50 : 1500);
setTimeout(initCloud, 0);
</script>
